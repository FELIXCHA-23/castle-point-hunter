name: keep-alive
# Supabase 무료 서버는 1주일 접속이 없으면 멈춥니다. 하루 한 번 가벼운 요청을 보내 깨어 있게 합니다.
on:
  schedule:
    - cron: '23 3 * * *'   # 매일 03:23 UTC = 12:23 KST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://iydtrglylllkljayumxl.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_MlqyFLfElmhIUCACI4X3Xg_ALEzPXfb" \
            -H "Content-Type: application/json" -d '{}'
