services:
  - type: web
    name: castle-point-hunter
    runtime: node
    plan: free
    buildCommand: echo ok
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false