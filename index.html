<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0C0F">
<title>캐슬 포인트 헌터스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f7f7f5;--bg2:#f7f7f5;--card:#ffffff;--ink:#17181c;--sub:#73757d;--line:#e8e7e5;--main:#c8161d;--main-ink:#ffffff;--tint:#fbefef;--gold:#17181c;--ok:#237a57;--bad:#c8161d;--fire:#c8161d;--shadow:0 2px 5px rgba(23,24,28,.025),0 10px 30px rgba(23,24,28,.045);--glass:rgba(255,255,255,.94);--radius:14px;--radius-sm:9px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;line-height:1.55;letter-spacing:-.01em;font-size:16px;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
#app.nonav{padding-bottom:40px}
h1{font-size:25px;font-weight:700;letter-spacing:-.03em;margin:0}h2{font-size:17px;font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.card{background:var(--card);border:1px solid rgba(20,22,28,.04);border-radius:18px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.pts{font-size:38px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.1}
.sub{color:var(--sub);font-size:13.5px}
button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 15px;border-radius:8px;transition:background .15s,transform .05s,opacity .15s}
button:active{transform:scale(.98)}
button.primary{background:var(--main);color:var(--main-ink);border-color:var(--main)}
button.danger{color:var(--bad)}
button.soft{background:var(--tint);color:var(--main);border-color:transparent}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn-big{width:100%;padding:15px;font-size:16px;margin-top:10px;border-radius:8px}
input,textarea,select{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--main);box-shadow:0 0 0 3px color-mix(in srgb,var(--main) 18%,transparent)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{padding:13px 0;font-size:16px;border-radius:8px;background:var(--bg);border-color:transparent;color:var(--ink)}
.grades button.on{background:var(--ink);color:#fff;box-shadow:inset 0 -3px 0 var(--main)}
.banner{background:var(--tint);color:var(--main);border:none;border-radius:8px;padding:11px 14px;margin-bottom:12px;font-weight:700;font-size:14px}
.prob{white-space:pre-wrap;font-size:17.5px;line-height:1.8;padding:2px 0;word-break:keep-all;overflow-wrap:anywhere}
/* 줄바꿈은 낱말(의미) 단위로: 한글이 글자 중간에서 끊기지 않게 */
body{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,h3,.sub,.pbox,.rules li,.mode span,.banner,label,p{text-wrap:balance}
td,th,input,textarea,.rk-nm,.chip,.gchip{overflow-wrap:anywhere;word-break:normal}
.modes{display:grid;gap:12px;margin:18px 0}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:18px;border-radius:10px;border:none;color:#fff;width:100%}
.mode b{font-size:18.5px;letter-spacing:-.02em}
.mode span{font-size:13.5px;color:rgba(255,255,255,.9);font-weight:500;line-height:1.5}
.mode.hunt{background:linear-gradient(135deg,#c8161d,#a80f16)}
.mode.season{background:#17181c}
.mode.roster{background:#34363d}
.mode.adm{background:#55565c}
.seg{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:6px;font-size:13.5px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat3>div{background:var(--bg);border-radius:8px;padding:11px 6px;text-align:center}
.stat3 b{display:block;font-size:21px;letter-spacing:-.03em}
.stat3 span{font-size:12px;color:var(--sub)}
.pbox{background:var(--tint);color:var(--main);border-radius:8px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.5;margin:10px 0}
.rules{margin:8px 0 0;padding-left:18px;color:var(--sub);font-size:13.5px;line-height:1.7}
.tbw{overflow-x:auto;margin:0 -4px}
.tbw table{min-width:480px;font-size:13px}
.pick{display:inline-flex;align-items:center;gap:6px;margin:3px 8px 3px 0;font-size:13.5px;font-weight:600;color:var(--ink)}
.pick input{width:auto}
.guestbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff4e5;border:1px solid #ffd8a8;color:#9a4b00;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px;font-weight:600;line-height:1.4}
.guestbar button{padding:6px 10px;font-size:12.5px;white-space:nowrap}
.ovl{position:fixed;inset:0;background:rgba(15,20,30,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
.ovl .box{background:#fff;border-radius:10px;padding:22px 20px 18px;max-width:360px;width:100%}
.ovl h2{margin:0 0 8px}.ovl p{margin:0 0 16px;color:var(--sub);line-height:1.6;font-size:14.5px}
.btnlink{display:inline-block;text-align:center;font-weight:700;color:var(--ink);background:var(--card);border:1px solid var(--line);padding:11px 15px;border-radius:8px;text-decoration:none;white-space:nowrap}
.btnlink.wide{display:block;padding:14px}
.btnlink.ico{flex:0 0 auto;width:30px;height:30px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:8px}
.btnlink.ico svg{width:16px;height:16px;stroke:var(--main)}
.btnlink.kk{background:#fee500;border-color:#fee500}.btnlink.kk svg{color:#3a1d1d}
.gchip{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:4px;background:var(--bg);color:var(--sub);font-size:11.5px;font-weight:700}
.pnote .katex{font-size:1.5em;color:var(--ink)}
.katex .frac-line{border-bottom-style:solid!important;border-bottom-color:currentColor;min-height:1px}
.pnote .frac-line{border-bottom-width:1.6px!important}
.pnote{font-size:14px;font-weight:600;color:var(--sub);background:var(--bg);border-radius:6px;padding:8px 12px;margin-bottom:6px;line-height:1.5}
.prob img{max-width:100%;display:block;margin:14px auto 4px;border-radius:10px;background:#fff}
.prob .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:.5em 0}
.katex{font-size:1.06em}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.bar>div{height:100%;background:var(--main);width:100%;border-radius:8px}
.timer{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.res{font-size:28px;font-weight:800;letter-spacing:-.04em}.ok{color:var(--ok)}.bad{color:var(--bad)}
.eimg{max-width:100%;display:block;margin:8px auto;border-radius:8px;background:#fff}
.expl{white-space:pre-wrap;border-left:3px solid var(--main);padding:10px 14px;margin:12px 0;background:var(--bg);border-radius:0 8px 8px 0;line-height:1.75;overflow-wrap:anywhere}
.err{color:var(--bad);min-height:20px;margin-top:8px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--sub);font-weight:600;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:left}
tr:last-child td{border-bottom:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 13px;border-radius:6px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.fire{color:var(--main);font-weight:700}
.hist{border-top:1px solid var(--line);padding:10px 0}
code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:.92em}
.logo{display:block;height:24px;width:auto;max-width:60%}
.logo-big{height:auto;width:90%;max-width:342px}
/* 학생 홈 (KASTLE MATH 디자인) */
.hero{position:relative;margin:2px 0 18px;padding:14px 0 8px;overflow:visible;min-height:168px}
.hero .hi{font-size:15.5px;font-weight:400;color:#5b5f68;margin:0 0 6px;letter-spacing:-.02em}
.hero h1{font-size:30px;line-height:1.26;font-weight:700;letter-spacing:-.045em;color:var(--ink)}
.hero .go{font-size:14px;font-weight:400;color:#6d717a;margin-top:10px;letter-spacing:-.02em}
.hero .deco{position:absolute;right:-16px;top:-6px;width:210px;height:190px;pointer-events:none;z-index:0;overflow:hidden;-webkit-mask-image:linear-gradient(to left,#000 62%,transparent);mask-image:linear-gradient(to left,#000 62%,transparent)}
.hero .deco i{position:absolute;display:block;transform:skewX(-30deg);border-radius:2px}
.hero .deco i:nth-child(1){right:92px;top:40px;width:64px;height:170px;background:linear-gradient(180deg,#f0f0f2,#fafafb)}
.hero .deco i:nth-child(2){right:62px;top:70px;width:34px;height:130px;background:linear-gradient(180deg,#e0252b,#b3121a)}
.hero .deco i:nth-child(3){right:20px;top:92px;width:40px;height:110px;background:linear-gradient(180deg,#34363d,#0e0f12)}
.hero .deco i:nth-child(4){right:118px;top:-10px;width:2px;height:150px;background:linear-gradient(180deg,#e0252b,transparent)}
.hero>*{position:relative;z-index:1}.hero .deco{z-index:0}
.ptc{padding:0;overflow:hidden}
.ptc .p1{display:flex;align-items:center;gap:16px;padding:22px 24px 18px;cursor:pointer}
.ptc .coin{width:44px;height:44px;flex:0 0 auto;color:var(--main)}
.ptc .p1 .lb{font-size:14.5px;font-weight:500;color:#33363d}
.ptc .p1 .big{font-size:40px;font-weight:700;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.05;margin-top:2px}
.ptc .p1 .big em{font-style:normal;font-size:17px;font-weight:700;color:var(--main);margin-left:4px;letter-spacing:0}
.ptc .p1 .ch{margin-left:auto;color:#b5b8bf;font-size:24px;font-weight:300}
.ptc .p2{display:grid;grid-template-columns:1fr 1fr 1.25fr;border-top:1px solid var(--line);margin:0 24px}
.ptc .p2>div{padding:16px 0;display:flex;gap:10px;align-items:center;min-width:0}
.ptc .p2>div+div{border-left:1px solid var(--line);padding-left:14px}
.ptc .p2 svg{width:22px;height:22px;flex:0 0 auto;color:var(--main)}
.ptc .p2 .t{font-size:11.5px;font-weight:400;color:var(--sub);line-height:1.3;white-space:nowrap;text-wrap:nowrap}
.ptc .p2 .v{font-size:24px;font-weight:600;letter-spacing:-.04em;line-height:1.15;font-variant-numeric:tabular-nums}
.ptc .p2 .v u{text-decoration:none;font-size:14px;font-weight:600;margin-left:1px}
.ptc .p2 .enc{font-size:11.5px;font-weight:400;color:var(--sub);line-height:1.5;text-wrap:nowrap}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.sec h2{margin:0;display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.03em}
.sec h2::before{content:"";width:3px;height:17px;background:var(--main);border-radius:2px}
.sec .sub{font-size:12px;text-align:right;color:var(--sub)}
.ring{position:relative;width:84px;height:84px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;letter-spacing:-.04em}
.ring b small{font-size:13px;font-weight:500;color:var(--sub);margin-left:2px}
.learn{display:flex;gap:18px;align-items:center}
.learn .r2{flex:1;min-width:0}
.learn .r2 .l1{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600;margin-bottom:8px}
.learn .r2 .l1 span:last-child{color:var(--sub);font-weight:400;font-size:12px;text-align:right}
.learn .bar{height:7px;background:#ececee}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:0;height:56px;border-radius:12px;font-size:16.5px;font-weight:600;letter-spacing:-.02em;background:linear-gradient(180deg,#d4191f 0%,#ab1017 100%);border:none;box-shadow:0 8px 18px rgba(200,22,29,.22),inset 0 1px 0 rgba(255,255,255,.18)}
.keep{display:flex;align-items:center;gap:14px}
.keep .ic{width:44px;height:44px;border-radius:12px;background:var(--tint);color:var(--main);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.keep .ic svg{width:22px;height:22px}
.keep .tx{flex:1;min-width:0}.keep .tx b{display:block;font-size:16px;font-weight:700;letter-spacing:-.03em}.keep .tx span{font-size:12.5px;font-weight:400;color:var(--sub)}
.keep button{border-radius:999px;padding:9px 16px;font-size:13px;font-weight:500;white-space:nowrap;background:#fff;border:1px solid #e2e3e6}
.nav button{font-weight:500}
.nav button.on{color:var(--main);box-shadow:inset 0 -3px 0 var(--main)}
.nav button svg{stroke-width:1.5}
.grades button{padding:0;height:50px;font-size:16px;font-weight:600;border-radius:10px;background:#f4f4f5;border-color:transparent}
.grades button.on{box-shadow:inset 0 -3px 0 var(--main)}
.hello{margin:6px 0 16px}.hello h1{font-size:25px}.hello .sub{margin-top:2px}
.pcard{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pcard .pts{font-size:36px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14.5px;color:var(--ink)}
.tile svg{width:26px;height:26px;stroke:var(--main)}
.prog{margin-top:10px}.prog .l{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.prog .l span{font-variant-numeric:tabular-nums}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav>div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;border:none;background:none;border-radius:0;padding:9px 0 11px;font-size:11.5px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:none}
.nav button svg{width:23px;height:23px;stroke:currentColor}
.nav button.on{color:var(--main)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:15px 2px;border:none;border-top:1px solid var(--line);background:none;border-radius:0;font-size:15.5px;font-weight:700;color:var(--ink);text-align:left;box-shadow:none}
.mpop-bg{position:fixed;inset:0;z-index:30}
.mpop{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));width:max-content;min-width:132px;max-width:calc(100vw - 24px);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 14px;max-height:70vh;overflow:auto}
.mpop .mrow{padding:11px 0;font-size:14px;font-weight:600}
.mpop .mrow:first-child{border-top:none}
.mrow .sub{font-size:12.5px;font-weight:500;margin:0}
.mrow i{font-style:normal;color:var(--sub);font-weight:400}
.chead{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}.chead .ct{flex:1;min-width:0;line-height:1.4}.chead .car{color:var(--sub,#888);font-size:16px}
.cnl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}.cnl .cn{margin:0}.cn0{padding:4px 11px}
.cn{padding:4px 11px;border-radius:6px;font-size:14px;font-weight:700;margin:0 2px 4px 0}
.eimg{display:block;max-width:100%;height:auto}
.dchart{display:flex;gap:6px;align-items:flex-end;height:120px;margin:12px 0 4px}
.dcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11.5px;color:var(--sub)}
.dcol em{font-style:normal;font-weight:700;color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
.dtot{width:100%;background:var(--bg);border-radius:4px 4px 0 0;display:flex;align-items:flex-end;min-height:3px}
.dtot i{display:block;width:100%;background:var(--main);border-radius:4px 4px 0 0}
.gbar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}
.gbar .t{flex:1;height:9px;background:var(--bg);border-radius:5px;overflow:hidden}.gbar .t i{display:block;height:100%;background:var(--main)}
.gbar span{font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
.back{display:flex;align-items:center;gap:6px;border:none;background:none;padding:6px 4px;font-size:14px;color:var(--sub);font-weight:600}
.back svg{width:20px;height:20px;stroke:currentColor}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--sub);font-size:12px;font-weight:600}
.thero{border-radius:16px;padding:20px 18px 16px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#24252a 0%,#17181c 70%,#303137 100%);box-shadow:0 10px 26px rgba(23,24,28,.14);position:relative;overflow:hidden}
.thero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10)}
.thero .tn{font-size:23px;font-weight:800;letter-spacing:-.3px;position:relative;z-index:1}
.thero .tsub{font-size:13px;opacity:.85;margin-top:3px;position:relative;z-index:1}
.thero .tscore{margin-top:12px;display:flex;align-items:baseline;gap:4px;position:relative;z-index:1}
.thero .tscore b{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.thero .tscore span{font-size:15px;font-weight:700;opacity:.85}
.thero .slots{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1}
.thero .slot{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;min-width:0;flex:1}
.thero .slot span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.92}
.thero.empty{background:linear-gradient(135deg,#292a30 0%,#17181c 100%)}
.thero.empty input{background:rgba(255,255,255,.96);color:#1a1d23;border-color:transparent}
.tmk{flex:0 0 auto;width:auto;padding:0 20px;background:#fff;color:#17181c;border-color:#fff;font-weight:700}
.av{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--main);font-weight:800;font-size:15px}
.thero .av{width:46px;height:46px;font-size:18px;background:rgba(255,255,255,.95);color:#17181c}
.thero .av.lead{box-shadow:0 0 0 3px #c8161d}
.thero .av.wait{opacity:.55}
.thero .av.empty{background:rgba(255,255,255,.16);color:rgba(255,255,255,.8);border:1.5px dashed rgba(255,255,255,.6);font-weight:600}
.av.lead{box-shadow:0 0 0 2px #c8161d}
.av.wait{opacity:.5}
.rk-row .av{width:34px;height:34px;font-size:14px}
.tquit{margin-top:14px;background:none;border:1px solid var(--line);color:var(--sub);font-weight:600}

/* =========================================================

    radial-gradient(ellipse 120% 46% at 50% -8%,rgba(225,38,45,.13) 0%,rgba(225,38,45,0) 62%),

<div id="app"></div>
<script src="config.js?v=20261027"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = localStorage.getItem('tk'), role = localStorage.getItem('role'), skew = 0, tick = null, me = null, pickedGrade = null;
const nowS = () => Date.now() + skew;
const fmt = (n) => Number(n).toLocaleString('ko-KR');
const fa = (s) => /^[ㄱ-ㅎ]+$/.test(String(s)) ? String(s).split('').join(', ') : s;

// 모든 기능은 Supabase 함수 castle_api 하나로 갑니다 (규칙·정답·비밀번호 검사는 Supabase 안에서 해요).
async function rawCall(path, body, tok) {
  const cfg = window.CASTLE_CONFIG || {};
  if (!cfg.url || !cfg.anonKey) throw new Error('config.js 에 Supabase 주소와 anon 키를 넣어 주십시오.');
  const r = await fetch(cfg.url.replace(/\/$/, '') + '/rest/v1/rpc/castle_api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: cfg.anonKey, Authorization: 'Bearer ' + cfg.anonKey },
    body: JSON.stringify({ p_path: path, p_token: tok || null, p_body: body === undefined ? {} : body }),
  }).catch(() => { throw new Error('인터넷 연결을 확인해 주십시오.'); });
  const j = await r.json().catch(() => ({}));
  return { status: r.status, ok: r.ok, j };
}
async function api(path, body) {
  if (guest && !path.startsWith('guest/')) return guestApi(path, body);
  const x = await rawCall(path, body, guest ? G.tok : token);
  if (x.status === 401) { if (guest) exitGuest(); else if (token) logout(); throw new Error(x.j.message || '다시 로그인해 주십시오.'); }
  if (!x.ok) throw new Error(x.j.message || '오류가 났습니다.');
  if (x.j && x.j.error) throw new Error(x.j.error);
  return x.j;
}

// ---------- 로그인 없이 탐험하기 (탐험 모드: 문제는 실제 문제, 포인트·기록은 이 화면 안에서만 쓰고 나가면 사라짐) ----------
let guest = false;
const G = { tok: null, cur: null, seen: [], sseen: [], score: 0, ok: 0, n: 0, points: 500, today: 0, hist: [], fr: [], team: null, avatar: '', log: [{ t: Date.now(), delta: 500, reason: '기본 포인트', balance: 500 }] };
// 탐험 모드의 포인트 내역 (이 화면 안에서만 기록)
const glog = (d, why, set) => { const bal = set ? G.points : G.points + d; G.log.push({ t: Date.now(), delta: set || d, reason: why, balance: bal }); return bal; };
const gfill = (p) => (p < 50 ? 110 : p);  // 풀이 포인트보다 모자라면 110P로 맞춤 (실제와 같은 규칙)
const guestMe = () => ({ id: 'guest', name: '탐험가', avatar: G.avatar, title: '님', grade: '', points: G.points, mustChange: false, isAdmin: false, isTeacher: false,
  grades: ['중1', '중2', '중3', '고1', '고2', '고3'], cfg: { START_POINTS: 500, PREVIEW_COST: 10, PREVIEW_SEC: 10, ACCEPT_COST: 50, TIME_LIMIT_SEC: 300, REWARD: 100, DAILY_BONUS_COUNT: 15, MORNING_FROM: 7, MORNING_TO: 9 },
  mult: { morning: false, daily: G.today >= 15, value: G.today >= 15 ? 2 : 1 }, todayCount: G.today, todayN: G.hist.length, streak: G.hist.length ? 1 : 0, active: G.cur ? gview(G.cur) : null, serverNow: Date.now() });
const gview = (a) => ({ state: a.state, season: !!a.season, problem: { id: a.p.id, grade: a.p.grade, text: a.p.text, image: a.p.image, kind: a.p.kind }, previewEndsAt: a.previewEndsAt || 0, deadline: a.deadline || 0 });
async function guestApi(path, b) {
  const now = Date.now();
  switch (path) {
    case 'me': return guestMe();
    case 'logout': return {};
    case 'rank': { const on = G.points > 500, row = [{ rank: 1, name: '탐*가', grade: '', points: G.points, me: true }]; return { grade: '', top: on ? row : [], myRank: on ? 1 : null, total: on ? 1 : 0, gradeTop: [], myGradeRank: null, gradeTotal: 0 }; }
    case 'season/info': { const pool = await api('guest/pool', { minLevel: 3 });
      return { serverNow: now, grade: '', canPlay: true, poolLeft: pool.n, total: 0, top: [], gradeTop: [], me: { score: G.score, rank: null, gradeRank: null, ok: G.ok, n: G.n },
        season: { id: 0, name: '탐험 시즌', status: 'active', startsAt: now - 864e5, endsAt: now + 7 * 864e5, prize: '', minLevel: 3, timeLimitSec: 300 } }; }
    case 'preview': {
      if (G.points < 10) throw new Error('포인트가 부족합니다.');
      const p = await api('guest/problem', { grade: b.grade, exclude: G.seen }); G.seen.push(p.id);
      G.points = gfill(glog(-10, '문제 미리보기'));
      G.cur = { p, state: 'preview', previewEndsAt: now + 10000 }; return { points: G.points, active: gview(G.cur), serverNow: now };
    }
    case 'accept':
      if (G.points < 50) throw new Error('풀이 포인트(50P)가 부족합니다.');
      G.points = gfill(glog(-50, '문제 풀기 선택'));
      G.cur.state = 'solving'; G.cur.deadline = now + 300000; G.cur.mult = G.today >= 15 ? 2 : 1; return { points: G.points, active: gview(G.cur), mult: G.cur.mult, serverNow: now };
    case 'skip': G.cur = null; return { points: G.points };
    case 'season/start': { const p = await api('guest/problem', { minLevel: 3, exclude: G.sseen }); G.sseen.push(p.id);
      G.cur = { p, state: 'solving', season: true, deadline: now + 300000 }; return { active: gview(G.cur), serverNow: now }; }
    case 'submit': {
      const a = G.cur; G.cur = null;
      if (!a) throw new Error('풀고 있는 문제가 없습니다.');
      const c = await api('guest/check', { id: a.p.id, answer: (b && b.answer) || '' }), ok = c.correct && String((b && b.answer) || '').trim() !== '';
      const lv = Math.max(c.level, 1), score = ok ? lv * 10 : String((b && b.answer) || '').trim() !== '' ? -lv * 5 : 0;
      G.hist.push({ grade: a.p.grade, ok });
      if (a.season) { G.n++; if (ok) G.ok++; G.score += score; }
      const mult = a.mult || 1, reward = ok && !a.season ? 100 * mult : 0;
      if (reward) { G.points += reward; G.today++; glog(0, '정답 보상 (+' + reward + ')', reward); }
      return { pid: a.p.id, correct: ok, timeout: false, reward, mult, points: G.points, answer: c.answer, explanation: c.explanation, extra: c.extra, explImage: c.explImage, season: !!a.season, score, guest: true };
    }
    case 'notices': { const x = await rawCall('notices', {}, G.tok); if (!x.ok) throw new Error(x.j.message || '오류가 났습니다.'); return x.j; }
    case 'stats': {
      const bg = {}; G.hist.forEach((x) => { const e = bg[x.grade] || (bg[x.grade] = { grade: x.grade, n: 0, ok: 0 }); e.n++; if (x.ok) e.ok++; });
      const days = [], t = new Date(); for (let i = 6; i >= 0; i--) { const d = new Date(t.getTime() - i * 864e5); days.push({ d: (d.getMonth() + 1) + '/' + d.getDate(), n: 0, ok: 0 }); }
      days[6].n = G.hist.length; days[6].ok = G.hist.filter((x) => x.ok).length;
      return { total: G.hist.length, ok: days[6].ok, days, byGrade: Object.values(bg).sort((a, b) => a.grade < b.grade ? -1 : 1), weak: [] };
    }
    case 'avatar/set': G.avatar = String((b && b.avatar) || ''); return { ok: true };
    case 'points/log': return G.log.slice().reverse();
    case 'notes': case 'history': return [];
    case 'catchu': return api('guest/catchu');
    case 'catchu/item': return api('guest/catchu_item', b);
    case 'friend/list': return { friends: G.fr.filter((x) => x.st === 'ok'), incoming: [], outgoing: G.fr.filter((x) => x.st === 'wait') };
    case 'friend/add': { const id = String((b && b.id) || '').trim(); if (!id) throw new Error('아이디를 입력하십시오.'); if (G.fr.some((x) => x.id === id)) throw new Error('이미 신청했습니다.'); G.fr.push({ id, name: id, grade: '', st: 'wait' }); return { ok: true }; }
    case 'friend/respond': return {};
    case 'friend/remove': G.fr = G.fr.filter((x) => x.id !== b.id); return {};
    case 'team/info': { const t = G.team; return { season: null, canPlay: true, invites: [], total: 0, top: [],
      team: t ? { id: 0, name: t.name, leader: true, score: 0, rank: null, members: [{ id: 'guest', name: '탐험가', grade: '', state: 'joined', leader: true, me: true, score: 0 }].concat(t.inv.map((id) => ({ id, name: id, grade: '', state: 'invited', leader: false, me: false, score: 0 }))) } : null }; }
    case 'team/create': { const n = String((b && b.name) || '').trim(); if (n.length < 2 || n.length > 12) throw new Error('팀 이름은 2~12자로 입력하십시오.'); G.team = { name: n, inv: [] }; return { ok: true }; }
    case 'team/invite': { const id = String((b && b.id) || '').trim(); if (!id) throw new Error('아이디를 입력하십시오.'); if (G.team.inv.length >= 3) throw new Error('팀은 최대 4명까지입니다.'); if (!G.team.inv.includes(id)) G.team.inv.push(id); return { ok: true }; }
    case 'team/cancel': G.team.inv = G.team.inv.filter((x) => x !== b.id); return {};
    case 'team/leave': G.team = null; return {};
    case 'note/add': throw new Error('탐험모드에서는 저장되지 않습니다.');
  }
  throw new Error('탐험모드에서는 사용할 수 없는 기능입니다.');
}
function startGuest() {
  const ov = document.createElement('div'); ov.className = 'ovl';
  ov.innerHTML = '<div class="box"><h2>탐험모드 안내</h2><p><b>탐험모드이므로 포인트는 사라집니다.</b><br>탐험 중에는 문제를 풀고 포인트를 쓰고 얻는 것까지 실제처럼 동작하지만, 나가면 포인트와 기록이 모두 사라집니다.</p><button class="primary btn-big" id="gok" style="margin:0">확인</button></div>';
  document.body.appendChild(ov);
  $('#gok').onclick = async () => {
    $('#gok').disabled = true;
    try {
      const x = await rawCall('guest/start', {}, null);
      if (!x.ok) throw new Error(x.j.message || '탐험을 시작할 수 없습니다.');
      ov.remove(); guest = true; token = null; role = 'student';
      Object.assign(G, { tok: x.j.token, cur: null, seen: [], sseen: [], score: 0, ok: 0, n: 0, points: 500, today: 0, hist: [] });
      me = await api('me'); skew = 0; renderHome();
    } catch (e) { ov.remove(); alert(e.message); }
  };
}
function exitGuest() { guest = false; token = null; role = null; me = null; G.tok = null; clearInterval(tick); renderLogin(); }

function logout() {
  if (guest) return exitGuest(); if (token) api('logout').catch(() => {}); token = null; role = null; localStorage.removeItem('tk'); localStorage.removeItem('role'); localStorage.removeItem('staff'); localStorage.removeItem('who'); try { sessionStorage.removeItem('mode'); } catch (_) {} clearInterval(tick); renderLogin(); }
async function switchTo(to) { try { const r = await api('switch', { to }); token = r.token; role = r.role; localStorage.setItem('tk', token); localStorage.setItem('role', role); start(); } catch (e) { alert(e.message); } }
function math(el) { if (window.renderMathInElement) try { renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false }); } catch (e) {} }
window.addEventListener('load', () => math(document.body));
const app = (html, nonav) => { clearInterval(tick); closeMore(); $('#app').className = nonav ? 'nonav' : ''; $('#app').innerHTML = (guest ? '<div class="guestbar"><span>탐험모드이므로 포인트는 사라집니다.</span></div>' : '') + html; math($('#app')); window.scrollTo(0, 0); };

// ---- 문제 화면 보호 (복사·저장·인쇄를 어렵게 해요) ----
const guard = (e) => { if (e.target.closest && e.target.closest('.prob,.eimg,.wm')) e.preventDefault(); };
document.addEventListener('contextmenu', guard);
document.addEventListener('dragstart', guard);
document.addEventListener('copy', (e) => { if (role !== 'admin' && e.target.closest && e.target.closest('.prob,.eimg,.wm,.expl')) e.preventDefault(); });
document.addEventListener('keydown', (e) => {
  if (role === 'admin') return;
  if (e.key === 'PrintScreen' || (e.ctrlKey && ['p', 's', 'u'].includes(e.key.toLowerCase())) || (e.metaKey && e.shiftKey && ['3', '4', '5'].includes(e.key))) {
    e.preventDefault(); document.body.classList.add('cover'); try { navigator.clipboard.writeText(' '); } catch (_) {}
    setTimeout(() => document.body.classList.remove('cover'), 1500);
  }
});
const cover = (on) => { if (role !== 'admin') document.body.classList.toggle('cover', on); };
document.addEventListener('visibilitychange', () => cover(document.hidden));
window.addEventListener('blur', () => cover(true));
window.addEventListener('focus', () => cover(false));
function showErr(m) { const e = $('#err'); if (e) e.textContent = m; }

};

// ---------- 로그인 ----------
function renderLogin(msg, signup) {
  app(`<div style="text-align:center;margin:9vh 0 26px"><img class="logo logo-big" src="logo_dark.png" alt="캐슬수학" style="margin:0 auto 18px"><h1>캐슬 포인트 헌터스</h1><p class="sub" style="margin-top:6px">${signup ? '아이디와 비밀번호만 정하면 바로 시작합니다' : '수학문제를 풀고 포인트를 모아보자!<br>주말, 공휴일 오전 7시~9시에는 2배 이벤트!! 🔥'}</p></div>

  <div class="row"><button class="primary nsv">저장</button><button class="danger ndl">오답노트에서 빼기</button></div></div>`).join('') || `<div class="card sub">${list.length ? '조건에 맞는 문제가 없습니다.' : '아직 담은 문제가 없습니다. 결과 화면이나 내 기록에서 “오답노트에 담기”를 눌러 보십시오.'}</div>`}

  if ($('#fper')) $('#fper').onchange = (e) => { notePeriod = e.target.value; renderNotes(); };
  if ($('#funit')) $('#funit').onchange = (e) => { noteUnit = e.target.value; renderNotes(); };
  document.querySelectorAll('.card[data-p]').forEach((c) => {
    const pid = c.dataset.p;
    c.querySelector('.sh').onclick = () => { const w = c.querySelector('.shw'); w.style.display = w.style.display === 'none' ? '' : 'none'; math(w); };
    c.querySelector('.nsv').onclick = async () => { try { await api('note/update', { pid, memo: c.querySelector('.nmm').value }); renderNotes(); } catch (e) { alert(e.message); } };
    c.querySelector('.ndl').onclick = async () => { if (confirm('오답노트에서 빼시겠습니까?')) { await api('note/del', { pid }); renderNotes(); } };
  });
}


// 캐치유테스트 오답: KMMS 에서 복사해 온 주차별 테스트 결과 (본인 것만 조회됨)
async function renderCatchu() {
  const list = await api('catchu');
  const nums = (a) => (a || []).map((n) => esc(n) + '번').join(', ');
  app(`<div class="top"><h1 style="font-size:22px">내 오답노트</h1></div>
  <div class="seg"><button data-v="mine">내가 담은 문제</button><button data-v="catchu" class="on">캐치유테스트</button></div>
  ${guest && list.length ? '<p class="sub" style="margin:0 0 8px">탐험 모드 예시입니다. 로그인하면 내가 틀린 문항이 이곳에 모입니다.</p>' : ''}
  ${list.map((r) => {
    const wr = r.wrong || [], sw = r.stillWrong;
    const retest = Array.isArray(sw) ? (sw.length ? `재시험 ${r.retestDate ? ymd(r.retestDate) : ''} · 아직 틀린 문항 <b>${nums(sw)}</b>` : `재시험 ${r.retestDate ? ymd(r.retestDate) : ''} · 모두 맞혔습니다`) : '';
    const mw = /(\d+)\s*월\s*(\d+)\s*주차/.exec(r.title || ''), nm = mw ? `[${mw[1]}월${mw[2]}주차] ` : '';
    const cnt = wr.length ? `${wr.length}문항` : '틀린 문항 없음';
    return `<div class="card ctest"><button class="chead" aria-expanded="false"><span class="ct"><b>${esc(nm + r.grade)}</b>${r.scope ? `<span class="sub"> (${esc(r.scope)})</span>` : ''}<span class="sub" style="display:block;margin-top:2px">${r.date ? ymd(r.date) + ' · ' : ''}${cnt}</span></span><span class="car">▾</span></button>
    <div class="cbody" style="display:none">${wr.length ? `<div class="cnl">${wr.map((n) => (r.have || []).includes(n) ? `<button class="cn" data-r="${esc(r.id)}" data-n="${n}">${n}번</button>` : `<b class="cn0">${n}번</b>`).join('')}</div>` : ''}
    <div class="citem" data-r="${esc(r.id)}"></div>
    ${retest ? `<p class="sub" style="margin:6px 0 0">${retest}</p>` : ''}</div></div>`;
  }).join('') || `<div class="card sub">${guest ? '탐험모드에서는 캐치유테스트 기록이 없습니다.' : '아직 가져온 캐치유테스트 기록이 없습니다. 10월 4주차 테스트부터 이곳에 모입니다.'}</div>`}
  ${navBar('nt')}`);
  bindNav();
  document.querySelectorAll('.seg [data-v=mine]').forEach((b) => b.onclick = renderNotes);
  document.querySelectorAll('.chead').forEach((b) => b.onclick = () => { const bd = b.nextElementSibling, open = bd.style.display === 'none'; bd.style.display = open ? '' : 'none'; b.setAttribute('aria-expanded', open); b.querySelector('.car').textContent = open ? '▴' : '▾'; });
  document.querySelectorAll('.cn').forEach((b) => b.onclick = async () => {
    const box = b.closest('.card').querySelector('.citem'), key = b.dataset.r + ':' + b.dataset.n;
    if (box.dataset.k === key) { box.innerHTML = ''; box.dataset.k = ''; return; }
    box.dataset.k = key; box.innerHTML = '<p class="sub">불러오는 중…</p>';
    try {
      const x = await api('catchu/item', { roundId: b.dataset.r, no: Number(b.dataset.n) });
      box.innerHTML = `<div class="wm" style="margin-top:8px"><img class="eimg" src="${esc(x.prob)}" alt="${b.dataset.n}번 문제"></div>
      ${x.expl ? `<button class="sh2" style="margin-top:8px">정답·해설 보기</button><div class="shw2" style="display:none;margin-top:8px"><div class="wm"><img class="eimg" src="${esc(x.expl)}" alt="해설"></div></div>` : ''}`;
      const sb = box.querySelector('.sh2'); if (sb) sb.onclick = () => { const w = box.querySelector('.shw2'); w.style.display = w.style.display === 'none' ? '' : 'none'; };
    } catch (e) { box.innerHTML = '<p class="sub">' + esc(e.message) + '</p>'; }
  });
}

// ---------- 모드 선택 · 시즌 랭킹전 · 선생님 화면 ----------
const LV = ['', '하', '중하', '중', '상', '최상'];
const ymd = (ms) => { const d = new Date(ms); return d.getFullYear() + '.' + (d.getMonth() + 1) + '.' + d.getDate(); };

const ago = (ms, now) => { if (!ms) return '기록 없음'; const m = Math.floor((now - ms) / 60000); if (m < 1) return '방금'; if (m < 60) return m + '분 전'; const hh = Math.floor(m / 60); if (hh < 24) return hh + '시간 전'; return Math.floor(hh / 24) + '일 전'; };

const teamRows = (top) => top.map((x) => `<div class="rk-row${x.me ? ' me' : ''}"><div class="rk-no">${x.rank <= 3 ? trophy(MEDAL[x.rank - 1]) : x.rank}</div><div class="rk-nm">${esc(x.name)} <span class="sub" style="font-weight:500">${esc(x.members || '')}</span>${x.me ? ' <span class="chip">내 팀</span>' : ''}</div><div class="rk-pt">${fmt(x.score)}점</div></div>`).join('');

// ---------- 팀: 내 팀 · 친구 · 팀랭킹전 ----------
const avatar = (name, cls) => `<span class="av ${cls || ''}">${esc((name || '?').slice(0, 1))}</span>`;
async function renderTeam(notice) {
  const head = '<div class="top"><img class="logo" src="logo_dark.png" alt="캐슬수학"></div>';
  let t, f;
  try { [t, f] = await Promise.all([api('team/info'), api('friend/list')]); } catch (e) { return renderHunt(e.message); }
  const tm = t.team, s = t.season;
  const memberIds = tm ? tm.members.map((m) => m.id) : [];
  const canInvite = tm && tm.leader && tm.members.length < 4;
  const joined = tm ? tm.members.filter((m) => m.state === 'joined').length : 0;
  let mine = '';
  if (tm) {
    const slots = [0, 1, 2, 3].map((i) => { const m = tm.members[i]; return m ? `<div class="slot">${avatar(m.name, (m.leader ? 'lead ' : '') + (m.state === 'invited' ? 'wait' : ''))}<span>${esc(m.name)}</span></div>` : '<div class="slot"><span class="av empty">+</span><span>&nbsp;</span></div>'; }).join('');
    mine = `<div class="thero"><div class="tn">${esc(tm.name)}</div>
      <div class="tsub">팀원 ${joined}/4${joined >= 2 && s ? ` · ${esc(s.name)} 팀랭킹전 ${tm.rank}위` : joined >= 2 ? '' : ' · 2명 이상 모이면 순위에 오릅니다'}</div>
      <div class="tscore"><b>${fmt(tm.score)}</b><span>점</span></div>
      <div class="slots">${slots}</div></div>
    <div class="card">
      ${tm.members.map((m) => `<div class="rk-row${m.me ? ' me' : ''}">${avatar(m.name, (m.leader ? 'lead ' : '') + (m.state === 'invited' ? 'wait' : ''))}<div class="rk-nm">${esc(m.name)}${m.grade ? `<span class="gchip">${esc(m.grade)}</span>` : ''}${m.leader ? ' <span class="chip">팀장</span>' : ''}${m.state === 'invited' ? ' <span class="sub">수락 대기</span>' : ''}</div>${m.state === 'invited' ? (tm.leader ? `<button class="tcancel" data-id="${esc(m.id)}" style="padding:4px 10px">취소</button>` : '') : `<div class="rk-pt">${fmt(m.score)}점</div>`}</div>`).join('')}
      ${canInvite ? '<label style="margin-top:14px">팀원 초대 (상대의 아이디)</label><div class="row" style="flex-wrap:nowrap"><input id="tinvid" placeholder="예: 신현고김캐슬" autocomplete="off" autocapitalize="none"><button class="primary" id="tinvgo" style="flex:0 0 auto;width:auto;padding:0 18px">초대</button></div>' : ''}
      <button id="tleave" class="tquit">${tm.leader ? '팀 해체' : '팀 탈퇴'}</button></div>`;
  } else if (t.canPlay) {
    mine = `<div class="thero empty"><div class="tn">나만의 팀을 만들어 보세요</div><div class="tsub">친구와 함께 점수를 모아 팀랭킹전에 도전합니다</div>
      <div class="row" style="flex-wrap:nowrap;margin-top:14px"><input id="tname" maxlength="12" placeholder="팀 이름 (2~12자)" autocomplete="off"><button class="tmk" id="tmake">만들기</button></div></div>
    ${t.invites.length ? `<div class="card"><h2 style="margin-bottom:6px">받은 초대</h2>${t.invites.map((i) => `<div class="pbox" style="margin:8px 0"><b>${esc(i.teamName)}</b> 팀에서 초대했습니다.<br><span class="sub">팀장 ${esc(i.from)} · 현재 ${i.size}명</span><div class="row" style="margin-top:8px"><button class="primary tacc" data-t="${i.teamId}" style="flex:1">수락</button><button class="tdec" data-t="${i.teamId}" style="flex:1">거절</button></div></div>`).join('')}</div>` : ''}`;
  }
  const fr = f.friends, inc = f.incoming;
  const inviteList = canInvite ? fr.filter((x) => !memberIds.includes(x.id)) : [];
  const friendsCard = t.canPlay ? `<div class="card"><div class="row" style="flex-wrap:nowrap;justify-content:space-between"><h2 style="margin:0">친구 <span class="sub" style="font-weight:600">${fr.length}명</span></h2><button id="gofr" style="padding:6px 14px">${inc.length ? `내 친구 · 신청 ${inc.length}건` : '내 친구'}</button></div>
    ${inviteList.length ? `<p class="sub" style="margin:10px 0 4px">친구를 팀에 초대합니다.</p>${inviteList.map((x) => `<div class="rk-row">${avatar(x.name)}<div class="rk-nm">${esc(x.name)}${x.grade ? `<span class="gchip">${esc(x.grade)}</span>` : ''}</div><button class="tinv" data-id="${esc(x.id)}" style="padding:4px 12px">팀 초대</button></div>`).join('')}` : ''}</div>` : '';

    <ul class="rules"><li>팀장이 팀을 만들고 초대하면, 초대받은 학생이 수락해 같은 팀이 됩니다.</li><li>팀은 <b>2명부터 4명까지</b>이며, 한 팀에만 속할 수 있습니다.</li><li>팀은 시즌 시작 전에도, 시즌 중에도 자유롭게 꾸리거나 탈퇴할 수 있습니다.</li><li>팀 점수는 그 팀에 속해 있는 동안 팀원이 얻은 개인랭킹전 점수를 모두 더한 값입니다. 가입 전이나 탈퇴 후의 점수는 포함되지 않습니다.</li></ul></div>`;
  app(`${head}<div class="err" id="terr">${esc(notice || '')}</div>${mine}${friendsCard}${board}${navBar('team')}`);

  const go = async (path, body) => { try { await api(path, body || {}); renderTeam(); } catch (e) { renderTeam(e.message); } };

}

let seasonGrade = '';
async function renderSeason(notice) {
  let d;

  const active = s.status === 'active', upcoming = s.status === 'upcoming';
  const left = Math.max(0, s.endsAt - d.serverNow), days = Math.floor(left / 86400000), hrs = Math.floor(left / 3600000) % 24;
  const state = active ? `진행 중 · 종료까지 ${days > 0 ? days + '일 ' : ''}${hrs}시간` : upcoming ? `${fmtDay(s.startsAt)}에 시작합니다` : '시즌이 끝났습니다';

  <div class="card"><h2 style="margin-bottom:4px">${esc(s.name)} 개인랭킹전</h2>
    <div class="sub">${fmtDay(s.startsAt)} ~ ${fmtDay(s.endsAt)} · ${state}</div>

      <div class="seg">${d.teachers.map((x) => `<button class="tt ${x.id === sel ? 'on' : ''}" data-t="${esc(x.id)}">${esc(x.name)}${esc(x.title)} (${x.students.length})</button>`).join('')}</div>
      ${t ? rosterTable(t.students, d.serverNow, true) : '<p class="sub">선생님 계정이 없습니다.</p>'}
      ${t && t.students.length ? '<button class="danger" id="rrm" style="margin-top:8px">선택한 학생 이 반에서 빼기</button>' : ''}</div>
      ${t ? `<div class="card"><h2>${esc(t.name)}${esc(t.title)} 반에 학생 추가</h2>
      <p class="sub">아이디를 한 줄에 하나씩 쓰거나, 아래 <b>아직 반이 없는 학생</b>에서 골라 주십시오.</p>
      <textarea id="radd" placeholder="해원고이시현&#10;신현고황서윤"></textarea>
      ${d.unassigned.length ? `<label>아직 반이 없는 학생 ${d.unassigned.length}명</label><div>${d.unassigned.map((u) => `<label class="pick"><input type="checkbox" class="ua" value="${esc(u.id)}">${esc(u.id)}<span class="gchip">${esc(u.grade || '-')}</span></label>`).join('')}</div>` : ''}
      <div class="err" id="err"></div><button class="primary" id="radd-go">추가</button></div>` : ''}`);
      bindTabs();
      document.querySelectorAll('.tt').forEach((b) => b.onclick = () => { window.__tt = b.dataset.t; renderAdmin('teams'); });
      if ($('#radd-go')) $('#radd-go').onclick = async () => {
        const ids = [...$('#radd').value.split(/\r?\n/).map((x) => x.trim()).filter(Boolean), ...[...document.querySelectorAll('.ua:checked')].map((c) => c.value)];
        if (!ids.length) return showErr('추가할 학생을 골라 주십시오.');
        try { const r = await api('admin/roster_edit', { teacher: sel, add: ids }); if (r.missing) alert('없는 아이디: ' + r.missing); renderAdmin('teams'); } catch (e) { showErr(e.message); }
      };
      if ($('#rrm')) $('#rrm').onclick = async () => {
        const ids = [...document.querySelectorAll('.rk:checked')].map((c) => c.value);
        if (!ids.length) return alert('빼려는 학생을 골라 주십시오.');
        if (!confirm(`${ids.length}명을 이 반에서 빼시겠습니까? (학생 계정은 그대로 남습니다)`)) return;
        try { await api('admin/roster_edit', { teacher: sel, remove: ids }); renderAdmin('teams'); } catch (e) { alert(e.message); }
      };
    } else if (tab === 'season') {
      const d = await api('admin/seasons'), z = (n) => String(n).padStart(2, '0');
      const loc = (ms) => { const t = new Date(ms); return `${t.getFullYear()}-${z(t.getMonth() + 1)}-${z(t.getDate())}T${z(t.getHours())}:${z(t.getMinutes())}`; };
      const st = (s) => d.serverNow < s.startsAt ? '예정' : d.serverNow < s.endsAt ? '진행 중' : '종료';
      app(`${tabs(tab)}<div class="card"><h2 id="sft">새 시즌 만들기</h2>
      <p class="sub">랭킹전 문제는 <b>난이도가 정해진 문제</b> 중에서 나옵니다. 지금 문제 수: 중 이상 <b>${d.pools[2]}개</b> · 상 이상 <b>${d.pools[3]}개</b> · 최상 <b>${d.pools[4]}개</b>. 시즌이 끝나면 아래에서 최종 순위를 보고 상품을 주십시오.</p>
      <input type="hidden" id="sid"><label>시즌 이름</label><input id="sn" placeholder="예: 2026 겨울 시즌 1" maxlength="40">
      <div class="row"><div><label>시작</label><input id="ss" type="datetime-local" value="${loc(Date.now())}"></div><div><label>종료</label><input id="se" type="datetime-local" value="${loc(Date.now() + 14 * 86400000)}"></div></div>
      <label>나오는 문제 난이도 (이 난이도 이상)</label><select id="sl">${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${n === 3 ? 'selected' : ''}>${LV[n]} 이상</option>`).join('')}</select>
      <label>상품 안내 (학생 화면에 보입니다)</label><input id="sp" placeholder="예: 1등 문화상품권 3만원, 2·3등 간식 쿠폰" maxlength="300">
      <div class="err" id="err"></div><div class="row"><button class="primary" id="ssv">저장</button><button id="scl">새로 만들기</button></div></div>
      ${d.seasons.map((s) => `<div class="card"><div class="row" style="flex-wrap:nowrap"><h2 style="flex:1;margin:0">${esc(s.name)} <span class="chip">${st(s)}</span></h2><button class="se" data-i="${s.id}">수정</button><button class="danger sd" data-i="${s.id}">삭제</button></div>
      <div class="sub" style="margin:6px 0">${fmtDay(s.startsAt)} ~ ${fmtDay(s.endsAt)} · 난이도 ${LV[s.minLevel]} 이상 문제 ${s.pool}개 · 참가 ${s.players}명${s.prize ? ' · 상품: ' + esc(s.prize) : ''}</div>
      ${s.top.length ? `<table><tr><th>순위</th><th>학생</th><th>학년</th><th>점수</th><th>맞힘</th></tr>${s.top.map((x) => `<tr><td>${x.rank}</td><td>${esc(x.id)}</td><td>${esc(x.grade || '-')}</td><td><b>${fmt(x.score)}</b></td><td>${x.ok}</td></tr>`).join('')}</table>` : '<p class="sub">아직 점수를 낸 학생이 없습니다.</p>'}</div>`).join('')}`);
      bindTabs();
      const clear = () => { $('#sft').textContent = '새 시즌 만들기'; $('#sid').value = ''; $('#sn').value = ''; $('#sp').value = ''; };
      $('#scl').onclick = clear;
      $('#ssv').onclick = async () => {
        try {
          await api('admin/season_save', { id: $('#sid').value || undefined, name: $('#sn').value, startsAt: new Date($('#ss').value).toISOString(), endsAt: new Date($('#se').value).toISOString(), minLevel: +$('#sl').value, prize: $('#sp').value });
          renderAdmin('season');
        } catch (e) { showErr(e.message); }
      };
      document.querySelectorAll('.se').forEach((b) => b.onclick = () => {
        const s = d.seasons.find((x) => x.id === +b.dataset.i); $('#sft').textContent = '시즌 수정'; $('#sid').value = s.id; $('#sn').value = s.name; $('#ss').value = loc(s.startsAt); $('#se').value = loc(s.endsAt); $('#sl').value = s.minLevel; $('#sp').value = s.prize; scrollTo(0, 0);
      });
      document.querySelectorAll('.sd').forEach((b) => b.onclick = async () => {
        if (!confirm('이 시즌과 시즌 기록을 모두 지우시겠습니까? 되돌릴 수 없습니다.')) return;
        try { await api('admin/season_delete', { id: +b.dataset.i }); renderAdmin('season'); } catch (e) { alert(e.message); }
      });
    } else if (tab === 'sus') {
      const days = window.__sd || 14, fast = window.__sf || 20, d = await api('admin/suspects', { days, fast });
      app(`${tabs(tab)}<div class="card"><h2>풀이 분석</h2><p class="sub">정답을 <b>${fast}초 안에</b> 맞힌 횟수를 학생별로 보여 줍니다. ${fast}초 안에 3번 이상, 맞힌 문제의 절반 이상이 그렇다면 <b>확인 필요</b>로 표시합니다. AI나 다른 사람의 도움을 받았다는 증거는 아니고, 직접 물어볼 학생을 좁히는 용도입니다.</p>
      <div class="row"><select id="sd">${[7, 14, 30, 90].map((x) => `<option value="${x}" ${x === days ? 'selected' : ''}>최근 ${x}일</option>`).join('')}</select><select id="sf">${[10, 15, 20, 30, 45, 60].map((x) => `<option value="${x}" ${x === fast ? 'selected' : ''}>${x}초 안에 정답</option>`).join('')}</select></div>
      ${d.length ? `<table><tr><th>학생</th><th>푼 수</th><th>정답률</th><th>중간 시간</th><th>빠른 정답</th><th></th></tr>${d.map((r) => `<tr><td>${esc(r.sid)}</td><td>${r.n}</td><td>${r.rate}%</td><td>${r.median}초</td><td><b>${r.fastCount}</b></td><td>${r.flag ? '<b class="bad">확인 필요</b>' : ''}</td></tr>${r.fast.length ? `<tr><td colspan="6" class="sub" style="font-size:12px">${r.fast.map((f) => `${esc(f.src || '삭제된 문제')} ${f.sec}초`).join(' · ')}</td></tr>` : ''}`).join('')}</table>` : '<p class="sub">이 기간에 푼 기록이 없습니다.</p>'}</div>`);
      bindTabs();
      $('#sd').onchange = (e) => { window.__sd = +e.target.value; renderAdmin('sus'); };
      $('#sf').onchange = (e) => { window.__sf = +e.target.value; renderAdmin('sus'); };
    } else if (tab === 'log') {
      const log = await api('admin/log');
      app(`${tabs(tab)}<div class="card"><h2>최근 포인트 기록</h2><table><tr><th>시각</th><th>학생</th><th>변동</th><th>잔액</th><th>내용</th></tr>
      ${log.map((l) => `<tr><td>${new Date(l.t).toLocaleString('ko-KR')}</td><td>${esc(l.sid)}</td><td class="${l.delta > 0 ? 'ok' : 'bad'}">${l.delta > 0 ? '+' : ''}${fmt(l.delta)}</td><td>${fmt(l.balance)}</td><td>${esc(l.reason)}</td></tr>`).join('')}</table></div>`);
      bindTabs();
    } else if (tab === 'rules') {
      const c = await api('admin/cfg');
      const F = [['START_POINTS', '처음 지급 포인트 (새 학생에게만)'], ['PREVIEW_COST', '미리보기 차감 포인트'], ['PREVIEW_SEC', '미리보기 시간 (초)'], ['ACCEPT_COST', '풀기 선택 차감 포인트'], ['TIME_LIMIT_MIN', '문제 제한시간 (분)'], ['REWARD', '정답 보상 포인트'], ['MORNING_FROM', '주말·공휴일 2배 시작 (시)'], ['MORNING_TO', '주말·공휴일 2배 끝 (시)'], ['DAILY_BONUS_COUNT', '하루 맞힌 문제 N개 이상이면 2배']];
      c.TIME_LIMIT_MIN = c.TIME_LIMIT_SEC / 60;
      app(`${tabs(tab)}<div class="card"><h2>규칙 값</h2><p class="sub">바꾼 값은 바로 적용됩니다. 진행 중인 문제의 제한시간은 그대로입니다.</p>
      ${F.map(([k, n]) => `<label>${n}</label><input class="cf" data-k="${k}" type="number" value="${c[k]}">`).join('')}
      <div class="err" id="err"></div><button class="primary" id="sv">저장</button></div>`);
      bindTabs();
      $('#sv').onclick = async () => {
        const v = {}; document.querySelectorAll('.cf').forEach((i) => v[i.dataset.k] = i.value);
        v.TIME_LIMIT_SEC = Number(v.TIME_LIMIT_MIN) * 60; delete v.TIME_LIMIT_MIN;
        try { await api('admin/setcfg', v); alert('저장했습니다.'); } catch (e) { showErr(e.message); }
      };
    } else if (tab === 'notice') {
      const list = await api('notices');
      const ed = list.find((n) => n.id === noticeEdit) || null;
      app(`${tabs(tab)}<div class="card"><h2>${ed ? '공지 수정' : '공지 작성'}</h2><p class="sub">학생 화면의 더보기 > 공지사항에 보입니다. 탐험모드에도 보입니다.</p>
      <input id="nt1" maxlength="60" placeholder="제목" value="${ed ? esc(ed.title) : ''}"><textarea id="nb1" maxlength="2000" placeholder="내용" style="margin-top:8px;min-height:130px">${ed ? esc(ed.body) : ''}</textarea>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="np1" style="width:auto" ${ed && ed.pinned ? 'checked' : ''}> 맨 위에 고정</label>
      <div class="err" id="err"></div><div class="row"><button class="primary" id="sv" style="flex:1">${ed ? '수정 저장' : '등록'}</button>${ed ? '<button id="ncx" style="flex:0 0 auto">취소</button>' : ''}</div></div>
      ${list.map((n) => `<div class="card"><div class="sub">${n.pinned ? '<span class="chip">고정</span> ' : ''}<span style="white-space:nowrap">${ymd(n.t)}</span></div><h2 style="margin:6px 0">${esc(n.title)}</h2><div style="white-space:pre-wrap">${esc(n.body)}</div><div class="row" style="margin-top:10px"><button class="nedit" data-i="${n.id}">수정</button><button class="danger ndl" data-i="${n.id}">삭제</button></div></div>`).join('')}`);
      bindTabs();
      $('#sv').onclick = async () => { try { await api('admin/notice/save', { id: ed ? ed.id : undefined, title: $('#nt1').value, body: $('#nb1').value, pinned: $('#np1').checked }); noticeEdit = 0; renderAdmin('notice'); } catch (e) { showErr(e.message); } };
      if ($('#ncx')) $('#ncx').onclick = () => { noticeEdit = 0; renderAdmin('notice'); };
      document.querySelectorAll('.nedit').forEach((b) => b.onclick = () => { noticeEdit = Number(b.dataset.i); renderAdmin('notice'); window.scrollTo(0, 0); });
      document.querySelectorAll('.ndl').forEach((b) => b.onclick = async () => { if (confirm('이 공지를 삭제하시겠습니까?')) { await api('admin/notice/del', { id: Number(b.dataset.i) }); if (noticeEdit === Number(b.dataset.i)) noticeEdit = 0; renderAdmin('notice'); } });
    } else {
      app(`${tabs(tab)}<div class="card"><h2>관리자 비밀번호 변경</h2><input id="np" type="password" placeholder="새 비밀번호 (4자 이상)"><div class="err" id="err"></div><button class="primary" id="sv">변경</button></div>`);
      bindTabs();
      $('#sv').onclick = async () => { try { await api('admin/adminpw', { pw: $('#np').value }); alert('변경했습니다.'); $('#np').value = ''; } catch (e) { showErr(e.message); } };
    }
  } catch (e) { if (token) alert(e.message); }
}

start();
</script>
</body>
</html>
