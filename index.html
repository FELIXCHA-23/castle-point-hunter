<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐슬 포인트 헌터</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f3f7ff;--bg2:#e6efff;--card:#ffffff;--ink:#0f1b3d;--sub:#6b7a99;--line:#e3eaf7;--main:#2b6bff;--main-ink:#ffffff;--tint:#eaf1ff;--gold:#0f1b3d;--ok:#0f9d58;--bad:#e5484d;--fire:#2b6bff;--shadow:0 2px 6px rgba(43,107,255,.05),0 10px 28px rgba(43,107,255,.08);--glass:rgba(255,255,255,.92)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--bg);background-image:linear-gradient(180deg,var(--bg2) 0,var(--bg) 320px);background-repeat:no-repeat;color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;line-height:1.55;letter-spacing:-.01em;font-size:16px;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
#app.nonav{padding-bottom:40px}
h1{font-size:26px;font-weight:800;letter-spacing:-.04em;margin:0}h2{font-size:17px;font-weight:800;letter-spacing:-.03em;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:12px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.pts{font-size:38px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.1}
.sub{color:var(--sub);font-size:13.5px}
button{font:inherit;font-weight:700;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:11px 15px;border-radius:14px;transition:background .15s,transform .05s,opacity .15s}
button:active{transform:scale(.98)}
button.primary{background:var(--main);color:var(--main-ink);border-color:var(--main);box-shadow:0 8px 20px rgba(43,107,255,.28)}
button.danger{color:var(--bad)}
button.soft{background:var(--tint);color:var(--main);border-color:transparent}
button:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn-big{width:100%;padding:17px;font-size:16.5px;margin-top:10px;border-radius:18px}
input,textarea,select{font:inherit;width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus,select:focus{border-color:var(--main);box-shadow:0 0 0 3px color-mix(in srgb,var(--main) 18%,transparent)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 6px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{padding:14px 0;font-size:16px;border-radius:14px;background:var(--bg);border-color:transparent;color:var(--ink)}
.grades button.on{background:var(--main);color:var(--main-ink);box-shadow:0 6px 16px rgba(43,107,255,.25)}
.banner{background:var(--tint);color:var(--main);border:none;border-radius:14px;padding:11px 14px;margin-bottom:12px;font-weight:700;font-size:14px}
.prob{white-space:pre-wrap;font-size:17.5px;line-height:1.8;padding:2px 0;word-break:keep-all;overflow-wrap:anywhere}
.modes{display:grid;gap:12px;margin:18px 0}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:18px 18px 17px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);width:100%}
.mode b{font-size:18px;letter-spacing:-.02em}
.mode span{font-size:13.5px;color:var(--sub);font-weight:500;line-height:1.5}
.mode.season{background:linear-gradient(135deg,#2b59ff,#5f86ff);border:none;color:#fff}
.mode.season span{color:rgba(255,255,255,.88)}
.seg{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:999px;font-size:13.5px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat3>div{background:var(--bg);border-radius:14px;padding:11px 6px;text-align:center}
.stat3 b{display:block;font-size:21px;letter-spacing:-.03em}
.stat3 span{font-size:12px;color:var(--sub)}
.pbox{background:var(--tint);color:var(--main);border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.5;margin:10px 0}
.rules{margin:8px 0 0;padding-left:18px;color:var(--sub);font-size:13.5px;line-height:1.7}
.tbw{overflow-x:auto;margin:0 -4px}
.tbw table{min-width:480px;font-size:13px}
.pick{display:inline-flex;align-items:center;gap:6px;margin:3px 8px 3px 0;font-size:13.5px;font-weight:600;color:var(--ink)}
.pick input{width:auto}
.gchip{display:inline-block;margin-left:5px;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--sub);font-size:11.5px;font-weight:700}
.pnote .katex{font-size:1.5em;color:var(--ink)}
.katex .frac-line{border-bottom-style:solid!important;border-bottom-color:currentColor;min-height:1px}
.pnote .frac-line{border-bottom-width:1.6px!important}
.pnote{font-size:14px;font-weight:600;color:var(--sub);background:var(--bg);border-radius:10px;padding:8px 12px;margin-bottom:6px;line-height:1.5}
.prob img{max-width:100%;display:block;margin:14px auto 4px;border-radius:10px;background:#fff}
.prob .katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:.5em 0}
.katex{font-size:1.06em}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}
.bar>div{height:100%;background:linear-gradient(90deg,#2b6bff,#5b9bff);width:100%;border-radius:8px}
.timer{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.res{font-size:28px;font-weight:800;letter-spacing:-.04em}.ok{color:var(--ok)}.bad{color:var(--bad)}
.eimg{max-width:100%;display:block;margin:8px auto;border-radius:8px;background:#fff}
.expl{white-space:pre-wrap;border-left:3px solid var(--main);padding:10px 14px;margin:12px 0;background:var(--bg);border-radius:0 12px 12px 0;line-height:1.75;overflow-wrap:anywhere}
.err{color:var(--bad);min-height:20px;margin-top:8px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--sub);font-weight:600;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:10px 6px;text-align:left}
tr:last-child td{border-bottom:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{padding:8px 13px;border-radius:999px}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}.row>button{flex:0 0 auto}
.fire{color:var(--main);font-weight:700}
.hist{border-top:1px solid var(--line);padding:10px 0}
code{background:var(--bg);padding:1px 6px;border-radius:6px;font-size:.92em}
.logo{display:block;height:24px;width:auto;max-width:60%}
.logo-big{height:auto;width:90%;max-width:342px}
.hello{margin:6px 0 16px}.hello h1{font-size:25px}.hello .sub{margin-top:2px}
.pcard{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pcard .pts{font-size:36px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;font-size:14.5px;color:var(--ink)}
.tile svg{width:26px;height:26px;stroke:var(--main)}
.prog{margin-top:10px}.prog .l{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.prog .l span{font-variant-numeric:tabular-nums}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav>div{display:flex;width:100%;max-width:520px}
.nav button{flex:1;border:none;background:none;border-radius:0;padding:9px 0 11px;font-size:11.5px;font-weight:600;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:none}
.nav button svg{width:23px;height:23px;stroke:currentColor}
.nav button.on{color:var(--main)}
.back{display:flex;align-items:center;gap:6px;border:none;background:none;padding:6px 4px;font-size:14px;color:var(--sub);font-weight:600}
.back svg{width:20px;height:20px;stroke:currentColor}
.chip{display:inline-block;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--sub);font-size:12px;font-weight:600}
.rk-row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:14px}
.rk-row:nth-child(-n+3){background:var(--bg)}
.rk-row.me{background:var(--tint);color:var(--main);font-weight:800}
.rk-no{width:26px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;display:flex;justify-content:center;color:var(--sub)}
.rk-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-pt{font-variant-numeric:tabular-nums;font-weight:700}
.rk-row+.rk-row{margin-top:4px}
@media (min-width:700px){#app{max-width:600px}.card{padding:24px}}
/* 문제 화면 보호: 복사·저장·인쇄를 어렵게 해요 */
.prob,.eimg,.wm{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.prob img,.eimg{pointer-events:none;-webkit-user-drag:none}
.wm{position:relative}
body.cover .prob,body.cover .eimg{filter:blur(22px);transition:filter .05s}
@media print{#app{display:none!important}body::before{content:"인쇄할 수 없어요";display:block;padding:40px;font-size:20px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js?v=20261027"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token = localStorage.getItem('tk'), role = localStorage.getItem('role'), skew = 0, tick = null, me = null, pickedGrade = null;
const nowS = () => Date.now() + skew;
const fmt = (n) => Number(n).toLocaleString('ko-KR');
const fa = (s) => /^[ㄱ-ㅎ]+$/.test(String(s)) ? String(s).split('').join(', ') : s;

// 모든 기능은 Supabase 함수 castle_api 하나로 갑니다 (규칙·정답·비밀번호 검사는 Supabase 안에서 해요).
async function api(path, body) {
  const cfg = window.CASTLE_CONFIG || {};
  if (!cfg.url || !cfg.anonKey) throw new Error('config.js 에 Supabase 주소와 anon 키를 넣어 주세요.');
  const r = await fetch(cfg.url.replace(/\/$/, '') + '/rest/v1/rpc/castle_api', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: cfg.anonKey, Authorization: 'Bearer ' + cfg.anonKey },
    body: JSON.stringify({ p_path: path, p_token: token || null, p_body: body === undefined ? {} : body }),
  }).catch(() => { throw new Error('인터넷 연결을 확인해 주세요.'); });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { if (token) logout(); throw new Error(j.message || '다시 로그인해 주세요.'); }
  if (!r.ok) throw new Error(j.message || '오류가 났어요.');
  if (j && j.error) throw new Error(j.error);
  return j;
}
function logout() { if (token) api('logout').catch(() => {}); token = null; role = null; localStorage.removeItem('tk'); localStorage.removeItem('role'); localStorage.removeItem('staff'); localStorage.removeItem('who'); try { sessionStorage.removeItem('mode'); } catch (_) {} clearInterval(tick); renderLogin(); }
async function switchTo(to) { try { const r = await api('switch', { to }); token = r.token; role = r.role; localStorage.setItem('tk', token); localStorage.setItem('role', role); start(); } catch (e) { alert(e.message); } }
function math(el) { if (window.renderMathInElement) try { renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false }); } catch (e) {} }
window.addEventListener('load', () => math(document.body));
const app = (html, nonav) => { clearInterval(tick); $('#app').className = nonav ? 'nonav' : ''; $('#app').innerHTML = html; math($('#app')); window.scrollTo(0, 0); };

// ---- 문제 화면 보호 (복사·저장·인쇄를 어렵게 해요) ----
const guard = (e) => { if (e.target.closest && e.target.closest('.prob,.eimg,.wm')) e.preventDefault(); };
document.addEventListener('contextmenu', guard);
document.addEventListener('dragstart', guard);
document.addEventListener('copy', (e) => { if (role !== 'admin' && e.target.closest && e.target.closest('.prob,.eimg,.wm,.expl')) e.preventDefault(); });
document.addEventListener('keydown', (e) => {
  if (role === 'admin') return;
  if (e.key === 'PrintScreen' || (e.ctrlKey && ['p', 's', 'u'].includes(e.key.toLowerCase())) || (e.metaKey && e.shiftKey && ['3', '4', '5'].includes(e.key))) {
    e.preventDefault(); document.body.classList.add('cover'); try { navigator.clipboard.writeText(' '); } catch (_) {}
    setTimeout(() => document.body.classList.remove('cover'), 1500);
  }
});
const cover = (on) => { if (role !== 'admin') document.body.classList.toggle('cover', on); };
document.addEventListener('visibilitychange', () => cover(document.hidden));
window.addEventListener('blur', () => cover(true));
window.addEventListener('focus', () => cover(false));
function showErr(m) { const e = $('#err'); if (e) e.textContent = m; }


const IC = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M14.5 3.5V7.5h4"/><path d="M9 12.5h6M9 16h4"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V2.8h6V4"/><path d="M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>',
  rank: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5A3 3 0 0 0 8 10.5M16 6h3v1.5a3 3 0 0 1-3 3"/><path d="M12 13v4M8.5 20h7"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  out: '<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4.5H5.5v15H10"/><path d="M14 8l4 4-4 4M18 12H9.5"/></svg>'
};
const trophy = (c) => `<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4h10v5.2A5 5 0 0 1 12 14a5 5 0 0 1-5-4.8z" fill="${c}"/><path d="M7 5.5H4.2v1.3A3.4 3.4 0 0 0 7.6 10.2M17 5.5h2.8v1.3a3.4 3.4 0 0 1-3.4 3.4" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"/><path d="M12 14v3.3M8.2 20h7.6M9.5 17.3h5" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const MEDAL = ['#f5b82e', '#9aa6b8', '#cd7f4a'];
const rankRows = (top) => top.map((x) => `<div class="rk-row${x.me ? ' me' : ''}"><div class="rk-no">${x.rank <= 3 ? trophy(MEDAL[x.rank - 1]) : x.rank}</div><div class="rk-nm">${esc(x.name)}${x.grade ? `<span class="gchip">${esc(x.grade)}</span>` : ''}${x.me ? ' <span class="chip">나</span>' : ''}</div><div class="rk-pt">${fmt(x.points)} P</div></div>`).join('');
function navBar(cur) {
  const it = [['home', '홈', IC.home, () => loadMe()], ['nt', '오답노트', IC.note, renderNotes], ['hist', '기록', IC.list, renderHistory], ['rk', '순위', IC.rank, () => renderHome('', true)]];
  return `<div class="nav"><div>${it.map(([k, n, ic]) => `<button data-n="${k}" class="${k === cur ? 'on' : ''}">${ic}${n}</button>`).join('')}</div></div>`;
}
function bindNav() {
  const f = { home: () => loadMe(), nt: renderNotes, hist: renderHistory, rk: () => renderHome('', true) };
  document.querySelectorAll('.nav button').forEach((b) => b.onclick = () => f[b.dataset.n]());
}

// ---------- 로그인 ----------
function renderLogin(msg, signup) {
  app(`<div style="text-align:center;margin:9vh 0 26px"><img class="logo logo-big" src="logo.png" alt="캐슬수학" style="margin:0 auto 18px"><h1>캐슬 포인트 헌터</h1><p class="sub" style="margin-top:6px">${signup ? '아이디와 비밀번호만 정하면 바로 시작해요' : '수학문제를 풀고 포인트를 모아보세요.<br>주말, 공휴일 오전 7시~9시에는 2배 이벤트!! 🔥'}</p></div>
  <div class="card"><label style="margin-top:0">아이디${signup ? ' (한글·영문·숫자 2~20자)' : ''}</label><input id="id" autocomplete="username" autocapitalize="none" autocorrect="off">
  <label>비밀번호${signup ? ' (4자 이상)' : ''}</label><input id="pw" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}">
  <div class="err" id="err">${esc(msg || '')}</div>
  <button class="primary btn-big" id="go" style="margin-top:6px">${signup ? '가입하고 시작하기' : '로그인'}</button></div>
  ${signup ? '' : '<p class="sub" style="text-align:center;margin:14px 8px 0">비밀번호를 잊은 경우<br><b>차성빈 원장</b>에게 초기화를 요청하세요.</p>'}`, true);
  const go = async () => {
    try {
      const r = await api(signup ? 'register' : 'login', { id: $('#id').value, pw: $('#pw').value });
      token = r.token; role = r.role; localStorage.setItem('tk', token); localStorage.setItem('role', role); localStorage.setItem('staff', r.staff ? '1' : ''); localStorage.setItem('who', r.name ? r.name + (r.title || '님') : '');
      start();
    } catch (e) { showErr(e.message); }
  };
  $('#go').onclick = go; $('#pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
}
function renderSetPw() {
  app(`<button class="back" id="bk" style="margin-top:14px">${IC.back}로그인 화면으로</button>
  <div class="card" style="margin-top:10px"><h1>비밀번호 설정</h1>
  <p class="sub">처음 로그인했어요! 나만 아는 비밀번호를 정해 주세요. (4자 이상, 0000은 사용할 수 없어요)</p>
  <label>새 비밀번호 (4자 이상)</label><input id="p1" type="password" autocomplete="new-password">
  <label>한 번 더 입력</label><input id="p2" type="password" autocomplete="new-password">
  <div class="err" id="err"></div><button class="primary btn-big" id="go">저장하고 시작하기</button></div>`);
  $('#bk').onclick = logout;
  $('#go').onclick = async () => {
    if ($('#p1').value !== $('#p2').value) return showErr('두 번 입력한 비밀번호가 달라요.');
    try { await api('setpw', { pw: $('#p1').value }); start(); } catch (e) { showErr(e.message); }
  };
}

// ---------- 학생 ----------
async function start() {
  if (!token) return renderLogin();
  if (role === 'admin') return renderAdmin('students');
  try { await loadMe(); } catch (e) { return renderLogin(e.message); }
}
async function loadMe(notice) {
  me = await api('me'); skew = me.serverNow - Date.now();
  if (me.mustChange) return renderSetPw();
  if (me.active) { if (me.active.season) setMode('season'); return me.active.state === 'preview' ? renderPreview(me.active) : renderSolve(me.active); }
  const m = getMode();
  if (!m) return renderModes();
  if (m === 'season') return renderSeason(notice);
  renderHome(notice);
}
function head() {

      const st = (s) => d.serverNow < s.startsAt ? '예정' : d.serverNow < s.endsAt ? '진행 중' : '종료';
      app(`${tabs(tab)}<div class="card"><h2 id="sft">새 시즌 만들기</h2>
      <p class="sub">랭킹전 문제는 <b>난이도가 정해진 문제</b> 중에서 나와요. 지금 문제 수: 중 이상 <b>${d.pools[2]}개</b> · 상 이상 <b>${d.pools[3]}개</b> · 최상 <b>${d.pools[4]}개</b>. 시즌이 끝나면 아래에서 최종 순위를 보고 상품을 주세요.</p>
      <input type="hidden" id="sid"><label>시즌 이름</label><input id="sn" placeholder="예: 2026 겨울 시즌 1" maxlength="40">
      <div class="row"><div><label>시작</label><input id="ss" type="datetime-local" value="${loc(Date.now())}"></div><div><label>종료</label><input id="se" type="datetime-local" value="${loc(Date.now() + 14 * 86400000)}"></div></div>
      <label>나오는 문제 난이도 (이 난이도 이상)</label><select id="sl">${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${n === 3 ? 'selected' : ''}>${LV[n]} 이상</option>`).join('')}</select>
      <label>상품 안내 (학생 화면에 보여요)</label><input id="sp" placeholder="예: 1등 문화상품권 3만원, 2·3등 간식 쿠폰" maxlength="300">
      <div class="err" id="err"></div><div class="row"><button class="primary" id="ssv">저장</button><button id="scl">새로 만들기</button></div></div>
      ${d.seasons.map((s) => `<div class="card"><div class="row" style="flex-wrap:nowrap"><h2 style="flex:1;margin:0">${esc(s.name)} <span class="chip">${st(s)}</span></h2><button class="se" data-i="${s.id}">수정</button><button class="danger sd" data-i="${s.id}">삭제</button></div>
      <div class="sub" style="margin:6px 0">${fmtDay(s.startsAt)} ~ ${fmtDay(s.endsAt)} · 난이도 ${LV[s.minLevel]} 이상 문제 ${s.pool}개 · 참가 ${s.players}명${s.prize ? ' · 🎁 ' + esc(s.prize) : ''}</div>
      ${s.top.length ? `<table><tr><th>순위</th><th>학생</th><th>학년</th><th>점수</th><th>맞힘</th></tr>${s.top.map((x) => `<tr><td>${x.rank}</td><td>${esc(x.id)}</td><td>${esc(x.grade || '-')}</td><td><b>${fmt(x.score)}</b></td><td>${x.ok}</td></tr>`).join('')}</table>` : '<p class="sub">아직 점수를 낸 학생이 없어요.</p>'}</div>`).join('')}`);
      bindTabs();
      const clear = () => { $('#sft').textContent = '새 시즌 만들기'; $('#sid').value = ''; $('#sn').value = ''; $('#sp').value = ''; };
      $('#scl').onclick = clear;
      $('#ssv').onclick = async () => {
        try {
          await api('admin/season_save', { id: $('#sid').value || undefined, name: $('#sn').value, startsAt: new Date($('#ss').value).toISOString(), endsAt: new Date($('#se').value).toISOString(), minLevel: +$('#sl').value, prize: $('#sp').value });
          renderAdmin('season');
        } catch (e) { showErr(e.message); }
      };
      document.querySelectorAll('.se').forEach((b) => b.onclick = () => {
        const s = d.seasons.find((x) => x.id === +b.dataset.i); $('#sft').textContent = '시즌 수정'; $('#sid').value = s.id; $('#sn').value = s.name; $('#ss').value = loc(s.startsAt); $('#se').value = loc(s.endsAt); $('#sl').value = s.minLevel; $('#sp').value = s.prize; scrollTo(0, 0);
      });
      document.querySelectorAll('.sd').forEach((b) => b.onclick = async () => {
        if (!confirm('이 시즌과 시즌 기록을 모두 지울까요? 되돌릴 수 없어요.')) return;
        try { await api('admin/season_delete', { id: +b.dataset.i }); renderAdmin('season'); } catch (e) { alert(e.message); }
      });
    } else if (tab === 'sus') {
      const days = window.__sd || 14, fast = window.__sf || 20, d = await api('admin/suspects', { days, fast });
      app(`${tabs(tab)}<div class="card"><h2>풀이 분석</h2><p class="sub">정답을 <b>${fast}초 안에</b> 맞힌 횟수를 학생별로 보여 줘요. ${fast}초 안에 3번 이상, 맞힌 문제의 절반 이상이 그렇다면 <b>확인 필요</b>로 표시해요. AI나 다른 사람의 도움을 받았다는 증거는 아니고, 직접 물어볼 학생을 좁히는 용도예요.</p>
      <div class="row"><select id="sd">${[7, 14, 30, 90].map((x) => `<option value="${x}" ${x === days ? 'selected' : ''}>최근 ${x}일</option>`).join('')}</select><select id="sf">${[10, 15, 20, 30, 45, 60].map((x) => `<option value="${x}" ${x === fast ? 'selected' : ''}>${x}초 안에 정답</option>`).join('')}</select></div>
      ${d.length ? `<table><tr><th>학생</th><th>푼 수</th><th>정답률</th><th>중간 시간</th><th>빠른 정답</th><th></th></tr>${d.map((r) => `<tr><td>${esc(r.sid)}</td><td>${r.n}</td><td>${r.rate}%</td><td>${r.median}초</td><td><b>${r.fastCount}</b></td><td>${r.flag ? '<b class="bad">확인 필요</b>' : ''}</td></tr>${r.fast.length ? `<tr><td colspan="6" class="sub" style="font-size:12px">${r.fast.map((f) => `${esc(f.src || '삭제된 문제')} ${f.sec}초`).join(' · ')}</td></tr>` : ''}`).join('')}</table>` : '<p class="sub">이 기간에 푼 기록이 없어요.</p>'}</div>`);
      bindTabs();
      $('#sd').onchange = (e) => { window.__sd = +e.target.value; renderAdmin('sus'); };
      $('#sf').onchange = (e) => { window.__sf = +e.target.value; renderAdmin('sus'); };
    } else if (tab === 'log') {
      const log = await api('admin/log');
      app(`${tabs(tab)}<div class="card"><h2>최근 포인트 기록</h2><table><tr><th>시각</th><th>학생</th><th>변동</th><th>잔액</th><th>내용</th></tr>
      ${log.map((l) => `<tr><td>${new Date(l.t).toLocaleString('ko-KR')}</td><td>${esc(l.sid)}</td><td class="${l.delta > 0 ? 'ok' : 'bad'}">${l.delta > 0 ? '+' : ''}${fmt(l.delta)}</td><td>${fmt(l.balance)}</td><td>${esc(l.reason)}</td></tr>`).join('')}</table></div>`);
      bindTabs();
    } else if (tab === 'rules') {
      const c = await api('admin/cfg');
      const F = [['START_POINTS', '처음 지급 포인트 (새 학생에게만)'], ['PREVIEW_COST', '미리보기 차감 포인트'], ['PREVIEW_SEC', '미리보기 시간 (초)'], ['ACCEPT_COST', '풀기 선택 차감 포인트'], ['TIME_LIMIT_MIN', '문제 제한시간 (분)'], ['REWARD', '정답 보상 포인트'], ['MORNING_FROM', '주말·공휴일 2배 시작 (시)'], ['MORNING_TO', '주말·공휴일 2배 끝 (시)'], ['DAILY_BONUS_COUNT', '하루 맞힌 문제 N개 이상이면 2배']];
      c.TIME_LIMIT_MIN = c.TIME_LIMIT_SEC / 60;
      app(`${tabs(tab)}<div class="card"><h2>규칙 값</h2><p class="sub">바꾼 값은 바로 적용돼요. 진행 중인 문제의 제한시간은 그대로예요.</p>
      ${F.map(([k, n]) => `<label>${n}</label><input class="cf" data-k="${k}" type="number" value="${c[k]}">`).join('')}
      <div class="err" id="err"></div><button class="primary" id="sv">저장</button></div>`);
      bindTabs();
      $('#sv').onclick = async () => {
        const v = {}; document.querySelectorAll('.cf').forEach((i) => v[i.dataset.k] = i.value);
        v.TIME_LIMIT_SEC = Number(v.TIME_LIMIT_MIN) * 60; delete v.TIME_LIMIT_MIN;
        try { await api('admin/setcfg', v); alert('저장했어요.'); } catch (e) { showErr(e.message); }
      };
    } else {
      app(`${tabs(tab)}<div class="card"><h2>관리자 비밀번호 변경</h2><input id="np" type="password" placeholder="새 비밀번호 (6자 이상)"><div class="err" id="err"></div><button class="primary" id="sv">변경</button></div>`);
      bindTabs();
      $('#sv').onclick = async () => { try { await api('admin/adminpw', { pw: $('#np').value }); alert('변경했어요.'); $('#np').value = ''; } catch (e) { showErr(e.message); } };
    }
  } catch (e) { if (token) alert(e.message); }
}

start();
</script>
</body>
</html>
